services:
  postgres:
    image: postgres:16
    container_name: movietrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movietrack
      POSTGRES_USER: movietrack
      POSTGRES_PASSWORD: movietrack_dev
    ports:
      - "5432:5432"
    volumes:
      - movietrack_postgres_data:/var/lib/postgresql/data

volumes:
  movietrack_postgres_data: